# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install package
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8
        pip install -r requirements.txt
        pip install .
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
  deploy:
    # only publish from pushes to main, never from pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: pypi
      url: https://pypi.org/p/peid
    permissions:
      # required for PyPI trusted publishing (OIDC)
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v5
    - name: Check whether the version is already on PyPI
      # comparing with PyPI (not with the previous commit) also releases a version whose push did not trigger a deploy
      id: version
      run: |
        version=$(tr -d '[:space:]' < src/peid/VERSION.txt)
        status=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 "https://pypi.org/pypi/peid/$version/json")
        case "$status" in
          200) echo "Version $version is already on PyPI" ; echo "new=false" >> "$GITHUB_OUTPUT" ;;
          404) echo "Version $version is not on PyPI yet" ; echo "new=true" >> "$GITHUB_OUTPUT" ;;
          *)   echo "::error::Unexpected HTTP status $status from PyPI" ; exit 1 ;;
        esac
    - if: steps.version.outputs.new == 'true'
      name: Cleanup README
      run: |
        sed -ri 's/^(##*)\s*:.*:\s*/\1 /g' README.md
        awk '{if (match($0,"## Supporters")) exit; print}' README.md > README
        mv -f README README.md
    - if: steps.version.outputs.new == 'true'
      name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"
    - if: steps.version.outputs.new == 'true'
      name: Build peid package
      run: python3 -m pip install --upgrade build && python3 -m build
    - if: steps.version.outputs.new == 'true'
      name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install package
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8
        pip install -r requirements.txt
        pip install .
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
  deploy:
    # only publish from pushes to main, never from pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: pypi
      url: https://pypi.org/p/peid
    permissions:
      # required for PyPI trusted publishing (OIDC)
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Check for version change
      uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          version:
            - '**/VERSION.txt'
    - if: steps.filter.outputs.version == 'true'
      name: Cleanup README
      run: |
        sed -ri 's/^(##*)\s*:.*:\s*/\1 /g' README.md
        awk '{if (match($0,"## Supporters")) exit; print}' README.md > README
        mv -f README README.md
    - if: steps.filter.outputs.version == 'true'
      name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"
    - if: steps.filter.outputs.version == 'true'
      name: Build peid package
      run: python3 -m pip install --upgrade build && python3 -m build
    - if: steps.filter.outputs.version == 'true'
      name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
